name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .uf2 to a GitHub Release on tags

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential python3

      - name: Cache Pico SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }}
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${PICO_SDK_VERSION}" https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"

      - name: Build
        run: cmake --build build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ds18b20_clone_detector-pico2_w
          path: |
            build/ds18b20_clone_detector.uf2
            build/ds18b20_clone_detector.elf

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ds18b20_clone_detector.uf2
